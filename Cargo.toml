[workspace]
members = [
  "crates/commandf-pkg",
  "crates/commandf-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "1.0"
