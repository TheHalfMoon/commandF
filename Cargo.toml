[workspace]
members = [
  "crates/commandf-csir",
  "crates/commandf-evidence",
  "crates/commandf-findings",
  "crates/commandf-package",
  "crates/commandf-validator",
  "crates/commandf-profiler",
  "crates/commandf-review",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
