name: AF-02 immutable object fallback repair

on:
  push:
    branches:
      - feat/af02-a0-authority-reconstruction
    paths:
      - .github/workflows/af02-object-fallback.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/af02-a0-authority-reconstruction
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt
      - name: Apply immutable object fallback
        env:
          HELPER_B64: 
          OLD_B64: ICAgIGFzc2VydCEoCiAgICAgICAgcmVzb2x2ZWQuc3RhdHVzLnN1Y2Nlc3MoKSwKICAgICAgICAiZ2l0IHJldi1wYXJzZSBmYWlsZWQgZm9yIHtzcGVjfToge30iLAogICAgICAgIFN0cmluZzo6ZnJvbV91dGY4X2xvc3N5KCZyZXNvbHZlZC5zdGRlcnIpCiAgICApOwogICAgbGV0IG9ic2VydmVkX2Jsb2IgPSBTdHJpbmc6OmZyb21fdXRmOChyZXNvbHZlZC5zdGRvdXQpCg==
          NEW_B64: ICAgIGlmICFyZXNvbHZlZC5zdGF0dXMuc3VjY2VzcygpIHsKICAgICAgICByZXR1cm4gZ2l0aHViX2NvbnRlbnRfb2JqZWN0X2J5dGVzKHJldmlzaW9uLCBwYXRoLCBleHBlY3RlZF9ibG9iKTsKICAgIH0KICAgIGxldCBvYnNlcnZlZF9ibG9iID0gU3RyaW5nOjpmcm9tX3V0ZjgocmVzb2x2ZWQuc3Rkb3V0KQo=
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("crates/commandf-pkg/tests/af02_authority_reconstruction.rs")
          text = path.read_text()
          helper = base64.b64decode(os.environ["HELPER_B64"]).decode()
          old = base64.b64decode(os.environ["OLD_B64"]).decode()
          new = base64.b64decode(os.environ["NEW_B64"]).decode()
          marker = "fn git_object_bytes(revision: &str, path: &str, expected_blob: &str) -> Vec<u8> {"
          if text.count(marker) != 1 or text.count(old) != 1:
              raise SystemExit("expected AF-02 patch anchors not found exactly once")
          text = text.replace(marker, helper + marker, 1).replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/af02-object-fallback.yml
          git add crates/commandf-pkg/tests/af02_authority_reconstruction.rs .github/workflows/af02-object-fallback.yml
          git diff --cached --check
          paths="$(git diff --cached --name-only)"
          expected="$(printf '%s\n%s' '.github/workflows/af02-object-fallback.yml' 'crates/commandf-pkg/tests/af02_authority_reconstruction.rs')"
          test "$paths" = "$expected" || {
            printf 'unexpected staged paths:\n%s\n' "$paths" >&2
            exit 1
          }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(af02): bind historical objects through immutable API"
          git push origin HEAD:feat/af02-a0-authority-reconstruction
