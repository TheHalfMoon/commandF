name: registry-contract-probe

on:
  push:
    branches:
      - ops/fhir-registry-contract-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe registry response shape without downloading package content into git
        run: |
          set -euo pipefail
          rm -rf /tmp/registry-probe
          mkdir -p /tmp/registry-probe

          for base in \
            https://packages.fhir.org \
            https://packages2.fhir.org/packages
          do
            safe="$(printf '%s' "$base" | tr '/:.' '_')"
            url="$base/hl7.fhir.us.core/8.0.1"
            echo "=== $url ==="
            set +e
            status="$(curl -sS --max-redirs 0 -D "/tmp/registry-probe/$safe.headers" -o "/tmp/registry-probe/$safe.body" -w '%{http_code}' "$url")"
            curl_status=$?
            set -e
            echo "curl_exit=$curl_status http_status=$status"
            grep -Ei '^(content-type|content-length|location):' "/tmp/registry-probe/$safe.headers" || true
            python - "$base" "/tmp/registry-probe/$safe.body" <<'PY'
          import json, sys
          from pathlib import Path
          base = sys.argv[1]
          data = Path(sys.argv[2]).read_bytes()
          print('bytes=', len(data), 'first8=', data[:8].hex())
          if data.startswith(b'\x1f\x8b'):
              print('shape=direct_gzip')
              raise SystemExit(0)
          try:
              obj = json.loads(data)
          except Exception as exc:
              print('shape=non_json_non_gzip', type(exc).__name__)
              raise SystemExit(0)
          print('shape=json keys=', sorted(obj.keys())[:20])
          dist = obj.get('dist') if isinstance(obj, dict) else None
          print('dist=', dist)
          if isinstance(dist, dict) and isinstance(dist.get('tarball'), str):
              print('tarball=', dist['tarball'])
          PY
          done
