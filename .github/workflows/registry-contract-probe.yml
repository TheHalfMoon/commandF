name: registry-contract-probe

on:
  push:
    branches:
      - ops/fhir-registry-contract-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe registry response shape without downloading package content into git
        run: |
          set -euo pipefail
          rm -rf /tmp/registry-probe
          mkdir -p /tmp/registry-probe

          for url in \
            https://packages.fhir.org/hl7.fhir.us.core/8.0.1 \
            https://packages2.fhir.org/packages/hl7.fhir.us.core/8.0.1 \
            https://packages2.fhir.org/web/hl7.fhir.us.core-8.0.1.tgz
          do
            safe="$(printf '%s' "$url" | tr '/:.' '_')"
            echo "=== $url ==="
            set +e
            status="$(curl -sS --max-redirs 0 -D "/tmp/registry-probe/$safe.headers" -o "/tmp/registry-probe/$safe.body" -w '%{http_code}' "$url")"
            curl_status=$?
            set -e
            echo "curl_exit=$curl_status http_status=$status"
            grep -Ei '^(content-type|content-length|location):' "/tmp/registry-probe/$safe.headers" || true
            python - "/tmp/registry-probe/$safe.body" <<'PY'
          import json, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          print('bytes=', len(data), 'first8=', data[:8].hex())
          if data.startswith(b'\x1f\x8b'):
              print('shape=direct_gzip')
              raise SystemExit(0)
          try:
              obj = json.loads(data)
          except Exception as exc:
              print('shape=non_json_non_gzip', type(exc).__name__)
              raise SystemExit(0)
          print('shape=json keys=', sorted(obj.keys())[:20] if isinstance(obj, dict) else type(obj).__name__)
          print('dist=', obj.get('dist') if isinstance(obj, dict) else None)
          PY
          done
