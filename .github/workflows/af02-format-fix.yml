name: af02-format-fix

on:
  push:
    branches:
      - feat/af02-a0-authority-reconstruction

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'TheHalfMoon/commandF'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt
      - name: Format and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo fmt --all
          rm .github/workflows/af02-format-fix.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'formatter produced no changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(af02): format authority verifier'
          git push origin "HEAD:${GITHUB_REF_NAME}"
