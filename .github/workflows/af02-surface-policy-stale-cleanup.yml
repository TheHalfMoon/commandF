name: af02-surface-policy-stale-cleanup

on:
  push:
    branches:
      - chore/af02-a0-surface-policy-stale-cleanup
    paths:
      - ".github/workflows/af02-surface-policy-stale-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: chore/af02-a0-surface-policy-stale-cleanup
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Remove the single stale source membership and rebase lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          BASE_SHA = "c36be98de6f7631aff3caf004b73e1d4ca07a49f"
          BASE_TREE = "2d0695b5be4aa732e19d0ae915e26ad9d5d71a4d"
          POLICY = "specs/016-af-02-adversarial-test-strength/surface-policy.json"
          PREDECESSOR_BLOB = "5a5e444d754795a701977bd55a7264cfed6b086d"
          STALE_PATH = "crates/commandf-pkg/src/registry.rs"

          def git(*args: str) -> bytes:
              return subprocess.check_output(["git", *args])

          if git("rev-parse", f"{BASE_SHA}^{{tree}}").decode().strip() != BASE_TREE:
              raise SystemExit("canonical base tree mismatch")
          if git("rev-parse", f"{BASE_SHA}:{POLICY}").decode().strip() != PREDECESSOR_BLOB:
              raise SystemExit("canonical predecessor blob mismatch")
          predecessor = git("show", f"{BASE_SHA}:{POLICY}")
          if Path(POLICY).read_bytes() != predecessor:
              raise SystemExit("working policy differs from canonical predecessor")
          predecessor_sha256 = hashlib.sha256(predecessor).hexdigest()

          before = json.loads(predecessor)
          after = copy.deepcopy(before)
          target = next(item for item in after["critical_surfaces"] if item["surface_id"] == "parser-package-name")
          if target["source_paths"].count(STALE_PATH) != 1:
              raise SystemExit("expected exactly one stale parser-package-name source membership")
          target["source_paths"].remove(STALE_PATH)

          lineage = after["lineage"]
          if lineage["mode"] != "REBASE" or lineage["change_is_policy_only"] is not True or lineage["dependent_evidence_allowed_in_same_candidate"] is not False:
              raise SystemExit("surface policy lineage invariants are not closed")
          lineage["canonical_base_sha"] = BASE_SHA
          lineage["canonical_base_tree"] = BASE_TREE
          lineage["predecessor_blob_sha"] = PREDECESSOR_BLOB
          lineage["predecessor_sha256"] = predecessor_sha256
          after["source_sha"] = BASE_SHA
          after["source_tree"] = BASE_TREE

          normalized = copy.deepcopy(after)
          normalized_target = next(item for item in normalized["critical_surfaces"] if item["surface_id"] == "parser-package-name")
          normalized_target["source_paths"] = next(item for item in before["critical_surfaces"] if item["surface_id"] == "parser-package-name")["source_paths"]
          for key in ("canonical_base_sha", "canonical_base_tree", "predecessor_blob_sha", "predecessor_sha256"):
              normalized["lineage"][key] = before["lineage"][key]
          normalized["source_sha"] = before["source_sha"]
          normalized["source_tree"] = before["source_tree"]
          if normalized != before:
              raise SystemExit("unexpected semantic policy delta outside the one stale membership and source/lineage bindings")

          canonical = json.dumps(after, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          Path(POLICY).write_bytes(canonical)
          print(f"predecessor_sha256={predecessor_sha256}")
          print(f"candidate_bytes={len(canonical)}")
          PY
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml surface::tests::canonical_surface_policy_parses
          git diff --check
      - name: Commit verified policy-only cleanup
        run: |
          set -euo pipefail
          git config user.name "commandF AF-02 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/016-af-02-adversarial-test-strength/surface-policy.json
          test "$(git diff --cached --name-only)" = "specs/016-af-02-adversarial-test-strength/surface-policy.json"
          git commit -m "chore(af02): remove stale surface membership"
          git push origin HEAD:chore/af02-a0-surface-policy-stale-cleanup
