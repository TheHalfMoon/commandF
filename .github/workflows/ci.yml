name: ci

on:
  pull_request:
  push:
    branches:
      - feat/cf-01-package-resolution
      - feat/cf-02-canonical-inspect
      - feat/cf-03-structural-diff
      - feat/cf-06-hl7-oracle-divergence

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Real FHIR registry, inspect, and self-diff smoke
        run: |
          rm -rf /tmp/commandf-smoke
          cargo run --locked --quiet -p commandf -- pkg resolve hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock
          cargo run --locked --quiet -p commandf -- pkg verify --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock
          cargo run --locked --quiet -p commandf -- inspect hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock --format json > /tmp/commandf-smoke/inspect.json

          cargo run --locked --quiet -p commandf -- pkg resolve hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/after-cache --lock /tmp/commandf-smoke/after.lock
          cargo run --locked --quiet -p commandf -- pkg verify --cache /tmp/commandf-smoke/after-cache --lock /tmp/commandf-smoke/after.lock
          cargo run --locked --quiet -p commandf -- diff hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format json > /tmp/commandf-smoke/diff.json

          python - <<'PY'
          import json
          from pathlib import Path

          inspect = json.loads(Path("/tmp/commandf-smoke/inspect.json").read_text())
          assert inspect["schema"] == 1
          assert inspect["package_name"] == "hl7.fhir.r4.core"
          assert inspect["package_version"] == "4.0.1"
          assert inspect["resources"]
          assert any(
              item["resource_type"] == "StructureDefinition" and item["elements"]
              for item in inspect["resources"]
          )

          diff = json.loads(Path("/tmp/commandf-smoke/diff.json").read_text())
          assert diff["schema"] == 1
          assert diff["package_name"] == "hl7.fhir.r4.core"
          assert diff["before"]["version"] == "4.0.1"
          assert diff["after"]["version"] == "4.0.1"
          assert diff["changes"] == []
          PY

  oracle-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build pinned HL7 oracle adapter
        run: mvn -B -ntp -f tools/hl7-oracle/pom.xml package
      - name: Resolve pinned real R4 oracle context
        run: |
          rm -rf /tmp/commandf-oracle-smoke
          cargo run --locked --quiet -p commandf -- pkg resolve hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-oracle-smoke/cache --lock /tmp/commandf-oracle-smoke/commandf.lock
          cargo run --locked --quiet -p commandf -- pkg verify --cache /tmp/commandf-oracle-smoke/cache --lock /tmp/commandf-oracle-smoke/commandf.lock
      - name: Real HL7 R4 self-equivalence oracle smoke
        run: |
          ARCHIVE="$(python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('/tmp/commandf-oracle-smoke/commandf.lock').read_text())
          package = next(item for item in lock['packages'] if item['name'] == 'hl7.fhir.r4.core')
          print(Path('/tmp/commandf-oracle-smoke/cache/sha256') / f"{package['sha256']}.tgz")
          PY
          )"

          "$JAVA_HOME/bin/java" -jar tools/hl7-oracle/target/commandf-hl7-oracle.jar \
            --core-package "$ARCHIVE" \
            --left-package "$ARCHIVE" \
            --right-package "$ARCHIVE" \
            --left-url http://hl7.org/fhir/StructureDefinition/Patient \
            --right-url http://hl7.org/fhir/StructureDefinition/Patient \
            > /tmp/commandf-oracle-smoke/hl7.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/commandf-oracle-smoke/hl7.json').read_text())
          assert report['schema'] == 1
          assert report['oracle'] == {
              'project': 'hapifhir/org.hl7.fhir.core',
              'release': '6.10.2',
              'source_commit': 'd06577dbc5c62c74a2a8823fbc4830a3024d5b0b',
          }
          assert report['left']['url'] == 'http://hl7.org/fhir/StructureDefinition/Patient'
          assert report['right']['url'] == 'http://hl7.org/fhir/StructureDefinition/Patient'
          assert report['messages'] == []
          assert all(
              state not in {'changed', 'cannot_evaluate'}
              for state in report['states'].values()
          )
          PY
      - name: Real commandf oracle self-diff smoke
        run: |
          cargo run --locked --quiet -p commandf -- oracle hl7.fhir.r4.core \
            --before-lock /tmp/commandf-oracle-smoke/commandf.lock \
            --before-cache /tmp/commandf-oracle-smoke/cache \
            --after-lock /tmp/commandf-oracle-smoke/commandf.lock \
            --after-cache /tmp/commandf-oracle-smoke/cache \
            --oracle-adapter tools/hl7-oracle/target/commandf-hl7-oracle.jar \
            --oracle-java "$JAVA_HOME/bin/java" \
            --format json \
            > /tmp/commandf-oracle-smoke/commandf.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/commandf-oracle-smoke/commandf.json').read_text())
          assert report['schema'] == 1
          assert report['package_name'] == 'hl7.fhir.r4.core'
          assert report['oracle']['release'] == '6.10.2'
          assert report['structural_diff']['changes'] == []
          assert report['resources'] == []
          PY
