name: ci

on:
  pull_request:
  push:
    branches:
      - feat/cf-01-package-resolution
      - feat/cf-02-canonical-inspect
      - feat/cf-03-structural-diff
      - feat/cf-07-terminology-diff
      - feat/cf-09-fsh-source-mapping

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: CF-08 Action runner security regression
        run: bash .github/scripts/test-cf08-action-runner.sh
      - name: CF-09 Action source-map security regression
        run: bash .github/scripts/test-cf09-action-source-map.sh
      - name: Real FHIR registry, inspect, self-diff, self-classify, and self-check smoke
        run: |
          rm -rf /tmp/commandf-smoke
          cargo run --locked --quiet -p commandf -- pkg resolve hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock
          cargo run --locked --quiet -p commandf -- pkg verify --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock
          cargo run --locked --quiet -p commandf -- inspect hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/before-cache --lock /tmp/commandf-smoke/before.lock --format json > /tmp/commandf-smoke/inspect.json

          cargo run --locked --quiet -p commandf -- pkg resolve hl7.fhir.r4.core@4.0.1 --cache /tmp/commandf-smoke/after-cache --lock /tmp/commandf-smoke/after.lock
          cargo run --locked --quiet -p commandf -- pkg verify --cache /tmp/commandf-smoke/after-cache --lock /tmp/commandf-smoke/after.lock
          cargo run --locked --quiet -p commandf -- diff hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format json > /tmp/commandf-smoke/diff.json
          cargo run --locked --quiet -p commandf -- classify hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format json > /tmp/commandf-smoke/classify.json
          cargo run --locked --quiet -p commandf -- check hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format json > /tmp/commandf-smoke/check.json
          cargo run --locked --quiet -p commandf -- check hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format sarif > /tmp/commandf-smoke/check.sarif

          python - <<'PY'
          import json
          from pathlib import Path

          inspect = json.loads(Path("/tmp/commandf-smoke/inspect.json").read_text())
          assert inspect["schema"] == 1
          assert inspect["package_name"] == "hl7.fhir.r4.core"
          assert inspect["package_version"] == "4.0.1"
          assert inspect["resources"]
          assert any(
              item["resource_type"] == "StructureDefinition" and item["elements"]
              for item in inspect["resources"]
          )

          diff = json.loads(Path("/tmp/commandf-smoke/diff.json").read_text())
          assert diff["schema"] == 1
          assert diff["package_name"] == "hl7.fhir.r4.core"
          assert diff["before"]["version"] == "4.0.1"
          assert diff["after"]["version"] == "4.0.1"
          assert diff["changes"] == []

          classify = json.loads(Path("/tmp/commandf-smoke/classify.json").read_text())
          assert classify["schema"] == 1
          assert classify["ruleset"] == "cf04-rules-v1"
          assert classify["package_name"] == "hl7.fhir.r4.core"
          assert classify["before"]["version"] == "4.0.1"
          assert classify["after"]["version"] == "4.0.1"
          assert classify["findings"] == []

          check = json.loads(Path("/tmp/commandf-smoke/check.json").read_text())
          assert check["schema"] == 1
          assert check["policy"] == {"direction": "both", "fail_on": "breaking"}
          assert check["decision"]["passed"] is True
          assert check["decision"]["blocking_findings"] == 0
          assert check["compatibility"]["findings"] == []

          sarif = json.loads(Path("/tmp/commandf-smoke/check.sarif").read_text())
          assert sarif["version"] == "2.1.0"
          assert len(sarif["runs"]) == 1
          assert sarif["runs"][0]["tool"]["driver"]["name"] == "commandF"
          assert sarif["runs"][0]["results"] == []
          assert sarif["runs"][0]["properties"]["commandf.decision.passed"] is True
          assert sarif["runs"][0]["properties"]["commandf.sourceMapping"] == "deferred_cf09"
          PY
      - name: Real FHIR self-terminology smoke
        run: |
          cargo run --locked --quiet -p commandf -- terminology hl7.fhir.r4.core --before-lock /tmp/commandf-smoke/before.lock --before-cache /tmp/commandf-smoke/before-cache --after-lock /tmp/commandf-smoke/after.lock --after-cache /tmp/commandf-smoke/after-cache --format json > /tmp/commandf-smoke/terminology.json
          python - <<'PY'
          import json
          from pathlib import Path

          terminology = json.loads(Path("/tmp/commandf-smoke/terminology.json").read_text())
          assert terminology["schema"] == 1
          assert terminology["ruleset"] == "cf07-terminology-v1"
          assert terminology["package_name"] == "hl7.fhir.r4.core"
          assert terminology["before"]["version"] == "4.0.1"
          assert terminology["after"]["version"] == "4.0.1"
          assert terminology["compatibility"]["findings"] == []
          assert terminology["code_systems"] == []
          assert terminology["value_sets"] == []
          assert terminology["binding_refinements"] == []
          PY
      - name: Prepare real CF-09 Action source-map fixture
        run: |
          mkdir -p input/fsh
          printf '[]\n' > /tmp/commandf-smoke/fsh-index.json
      - name: Local GitHub Action source-map self-check smoke
        id: cf09-action
        uses: ./
        with:
          package: hl7.fhir.r4.core
          before-lock: /tmp/commandf-smoke/before.lock
          before-cache: /tmp/commandf-smoke/before-cache
          after-lock: /tmp/commandf-smoke/after.lock
          after-cache: /tmp/commandf-smoke/after-cache
          fsh-index: /tmp/commandf-smoke/fsh-index.json
          fsh-root: input/fsh
      - name: Verify local GitHub Action outputs
        env:
          REPORT_PATH: ${{ steps.cf09-action.outputs.report-path }}
          EXIT_CODE: ${{ steps.cf09-action.outputs.exit-code }}
          PASSED: ${{ steps.cf09-action.outputs.passed }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          assert os.environ["EXIT_CODE"] == "0"
          assert os.environ["PASSED"] == "true"
          report_path = Path(os.environ["REPORT_PATH"])
          assert report_path.is_file()
          report = json.loads(report_path.read_text())
          assert report["schema"] == 1
          assert report["policy"] == {"direction": "both", "fail_on": "breaking"}
          assert report["decision"]["passed"] is True
          assert report["decision"]["blocking_findings"] == 0
          assert report["compatibility"]["findings"] == []
          PY
