name: cf10-structure-context-fix

on:
  push:
    branches:
      - ops/cf10-structure-context-fix

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --locked
      - name: Build pinned HL7 oracle adapter
        run: mvn -B -ntp -f tools/hl7-oracle/pom.xml package
      - name: Build commandF corpus runner
        run: cargo build --locked -p commandf
      - name: Build C002-only manifest from frozen corpus metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('corpus/real-ig/v1/corpus.json').read_text())
          cases = [case for case in source['cases'] if case['id'] == 'C002']
          assert len(cases) == 1
          source['cases'] = cases
          Path('/tmp/cf10-c002.json').write_text(json.dumps(source, indent=2, sort_keys=True) + '\n')
          PY
      - name: Prove frozen C002 through real corpus path
        run: |
          set -euo pipefail
          ./target/debug/commandf corpus run \
            --manifest /tmp/cf10-c002.json \
            --work-root /tmp/cf10-c002-work \
            --oracle-adapter tools/hl7-oracle/target/commandf-hl7-oracle.jar \
            --oracle-java "$JAVA_HOME/bin/java" \
            --format json \
            > /tmp/cf10-c002-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/cf10-c002-summary.json').read_text())
          assert [case['case_id'] for case in summary['cases']] == ['C002']
          case = summary['cases'][0]
          assert case['status'] == 'complete', summary
          assert len(case['before']['closure_sha256']) == 64
          assert len(case['after']['closure_sha256']) == 64
          assert case['before']['closure']
          assert case['after']['closure']
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Commit tested source tree only
        run: |
          set -euo pipefail
          rm -f .github/workflows/cf10-structure-context-fix.yml
          rm -rf tools/hl7-oracle/target
          git add -A
          git config user.name 'commandF ops'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cf06): scope dependency context to StructureDefinitions'
          git push origin HEAD:ops/cf10-structure-context-fix
