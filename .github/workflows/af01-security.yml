name: af01-security

on:
  pull_request:
  push:
    branches:
      - feat/af01-stack-b-dependency-security

permissions:
  contents: read

jobs:
  dependency-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Generate exact locked dependency inventory
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/commandf-cargo-metadata.json
          python3 .github/scripts/summarize_cargo_metadata.py \
            < /tmp/commandf-cargo-metadata.json \
            | tee af01-t020-dependency-inventory.json
      - name: Upload exact dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-t020-dependency-inventory
          path: af01-t020-dependency-inventory.json
          if-no-files-found: error
          retention-days: 7

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false
      - name: Record cargo-deny proof identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          proof = {
              "action_commit": "3c6349835b2b7b196a839186cb8b78e02f7b5f25",
              "action_release": "v2.1.1",
              "cargo_deny_version": "0.20.2",
              "cargo_lock_sha256": sha256("Cargo.lock"),
              "checks": ["advisories", "bans", "licenses", "sources"],
              "command": "cargo deny --all-features check advisories bans licenses sources",
              "deny_toml_sha256": sha256("deny.toml"),
              "head_sha": os.environ["GITHUB_SHA"],
              "schema": 1,
          }
          Path("af01-cargo-deny-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - name: Enforce cargo-deny dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 / cargo-deny 0.20.2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources
          log-level: warn
      - name: Upload cargo-deny proof identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-cargo-deny-proof
          path: af01-cargo-deny-proof.json
          if-no-files-found: error
          retention-days: 7
