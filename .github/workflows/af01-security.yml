name: af01-security

on:
  pull_request:
  push:
    branches:
      - feat/af01-stack-b-dependency-security

permissions:
  contents: read

env:
  AF01_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dependency-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: ${{ env.AF01_SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Generate exact locked dependency inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AF01_SOURCE_SHA"
          cargo metadata --locked --format-version 1 > /tmp/commandf-dependency-metadata.json
          python3 .github/scripts/summarize_cargo_metadata.py \
            < /tmp/commandf-dependency-metadata.json \
            | tee af01-t020-dependency-inventory.json
      - name: Upload exact dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-t020-dependency-inventory
          path: af01-t020-dependency-inventory.json
          if-no-files-found: error
          retention-days: 7

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: ${{ env.AF01_SOURCE_SHA }}
          persist-credentials: false
      - name: Record cargo-deny proof identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AF01_SOURCE_SHA"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          proof = {
              "action_commit": "3c6349835b2b7b196a839186cb8b78e02f7b5f25",
              "action_release": "v2.1.1",
              "cargo_deny_version": "0.20.2",
              "cargo_lock_sha256": sha256("Cargo.lock"),
              "checks": ["advisories", "bans", "licenses", "sources"],
              "command": "cargo deny --all-features check advisories bans licenses sources",
              "deny_toml_sha256": sha256("deny.toml"),
              "head_sha": os.environ["AF01_SOURCE_SHA"],
              "schema": 1,
          }
          Path("af01-cargo-deny-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - name: Enforce cargo-deny dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 / cargo-deny 0.20.2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories bans licenses sources
          log-level: warn
      - name: Upload cargo-deny proof identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-cargo-deny-proof
          path: af01-cargo-deny-proof.json
          if-no-files-found: error
          retention-days: 7

  cargo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: ${{ env.AF01_SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Assert exact source checkout
        run: test "$(git rev-parse HEAD)" = "$AF01_SOURCE_SHA"
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit exact Cargo.lock
        run: |
          set +e
          cargo audit --file Cargo.lock --json > af01-rustsec-audit.json
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > af01-rustsec-audit.exit
      - name: Record cargo-audit and advisory database identity
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          db = Path.home() / ".cargo" / "advisory-db"
          exit_path = Path("af01-rustsec-audit.exit")
          result_path = Path("af01-rustsec-audit.json")
          if not exit_path.is_file() or not result_path.is_file() or not (db / ".git").is_dir():
              raise SystemExit("cargo-audit evidence or advisory database identity is missing")

          proof = {
              "advisory_db_commit": subprocess.check_output(
                  ["git", "-C", str(db), "rev-parse", "HEAD"], text=True
              ).strip(),
              "advisory_db_origin": subprocess.check_output(
                  ["git", "-C", str(db), "remote", "get-url", "origin"], text=True
              ).strip(),
              "cargo_audit_version": "0.22.2",
              "cargo_lock_sha256": hashlib.sha256(Path("Cargo.lock").read_bytes()).hexdigest(),
              "command": "cargo audit --file Cargo.lock --json",
              "exit_code": int(exit_path.read_text(encoding="utf-8").strip()),
              "head_sha": os.environ["AF01_SOURCE_SHA"],
              "schema": 1,
          }
          Path("af01-rustsec-audit-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - name: Upload cargo-audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-rustsec-audit
          path: |
            af01-rustsec-audit.json
            af01-rustsec-audit.exit
            af01-rustsec-audit-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce cargo-audit result
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path("af01-rustsec-audit.exit")
          if not path.is_file():
              raise SystemExit("cargo-audit exit evidence is missing")
          sys.exit(int(path.read_text(encoding="utf-8").strip()))
          PY

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: ${{ env.AF01_SOURCE_SHA }}
          persist-credentials: false
      - name: Record zizmor policy identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AF01_SOURCE_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = {
              "action_commit": "3dc1ecc9bcb9e94e9b2c709687979e1298497054",
              "action_release": "v0.6.2",
              "advanced_security": False,
              "collect": "all",
              "head_sha": os.environ["AF01_SOURCE_SHA"],
              "min_severity": "medium",
              "online_audits": False,
              "schema": 1,
              "zizmor_version": "1.29.0",
          }
          Path("af01-zizmor-proof.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY
      - name: Audit workflows and Actions with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2 / zizmor 1.29.0
        with:
          inputs: .
          collect: all
          online-audits: false
          persona: regular
          min-severity: medium
          version: 1.29.0
          advanced-security: false
          color: false
          annotations: false
          fail-on-no-inputs: true
      - name: Upload zizmor policy identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af01-zizmor-proof
          path: af01-zizmor-proof.json
          if-no-files-found: error
          retention-days: 7
