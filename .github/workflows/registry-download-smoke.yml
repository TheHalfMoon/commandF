name: registry-download-smoke

on:
  pull_request:
    paths:
      - crates/commandf-pkg/src/registry.rs
      - .github/workflows/registry-download-smoke.yml
  push:
    branches:
      - main
    paths:
      - crates/commandf-pkg/src/registry.rs
      - .github/workflows/registry-download-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Focused registry unit tests
        run: cargo test --locked -p commandf-pkg registry::tests -- --skip real_primary_us_core_is_direct_gzip --skip real_secondary_us_core_follows_only_expected_tarball

      - name: Real primary US Core archive response
        run: cargo test --locked -p commandf-pkg registry::tests::real_primary_us_core_is_direct_gzip -- --ignored --exact

      - name: Real secondary redirect-to-tarball response
        run: cargo test --locked -p commandf-pkg registry::tests::real_secondary_us_core_follows_only_expected_tarball -- --ignored --exact

      - name: Diagnostic dependency manifest layout
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import io
          import json
          import tarfile
          import urllib.request

          COMPRESSED_LIMIT = 128 * 1024 * 1024
          DIAGNOSTIC_DECOMPRESSED_LIMIT = 768 * 1024 * 1024

          def read_url(url, limit=COMPRESSED_LIMIT):
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError(f'compressed response exceeds diagnostic bound: {url}')
              return data

          class CountingReader:
              def __init__(self, inner):
                  self.inner = inner
                  self.read_bytes = 0
              def read(self, size=-1):
                  remaining = DIAGNOSTIC_DECOMPRESSED_LIMIT - self.read_bytes
                  if remaining <= 0:
                      raise RuntimeError('diagnostic decompressed bound exceeded before manifest')
                  if size < 0 or size > remaining:
                      size = remaining
                  chunk = self.inner.read(size)
                  self.read_bytes += len(chunk)
                  return chunk

          def parse_version(text):
              core = text.split('-', 1)[0].split('+', 1)[0]
              parts = core.split('.')
              if len(parts) != 3 or not all(p.isdigit() for p in parts):
                  return None
              if '-' in text:
                  return None
              return tuple(map(int, parts))

          def select_version(name, constraint):
              if not constraint.endswith('.x'):
                  return constraint
              major, minor, _ = constraint.split('.')
              metadata = json.loads(read_url(f'https://packages.fhir.org/{name}', 4 * 1024 * 1024))
              matches = []
              for raw in metadata.get('versions', {}):
                  parsed = parse_version(raw)
                  if parsed and parsed[0] == int(major) and parsed[1] == int(minor):
                      matches.append((parsed, raw))
              if not matches:
                  raise RuntimeError(f'no patch wildcard match for {name}@{constraint}')
              return max(matches)[1]

          def inspect(name, version):
              url = f'https://packages.fhir.org/{name}/{version}'
              data = read_url(url)
              if not data.startswith(b'\x1f\x8b'):
                  raise RuntimeError(f'not gzip: {name}@{version}')
              counted = CountingReader(gzip.GzipFile(fileobj=io.BytesIO(data), mode='rb'))
              entries_before = 0
              payload_before = 0
              with tarfile.open(fileobj=counted, mode='r|') as tf:
                  for member in tf:
                      normalized = member.name[2:] if member.name.startswith('./') else member.name
                      if normalized == 'package/package.json':
                          body = tf.extractfile(member).read()
                          manifest = json.loads(body)
                          return {
                              'name': name,
                              'version': version,
                              'compressed_bytes': len(data),
                              'entries_before_manifest': entries_before,
                              'payload_bytes_before_manifest': payload_before,
                              'decompressed_bytes_read_to_manifest': counted.read_bytes,
                              'manifest_bytes': member.size,
                              'dependencies': manifest.get('dependencies', {}),
                          }
                      entries_before += 1
                      payload_before += member.size
              raise RuntimeError(f'manifest not found: {name}@{version}')

          root = inspect('hl7.fhir.us.core', '8.0.1')
          print('ROOT')
          print(json.dumps(root, indent=2, sort_keys=True))
          print('DIRECT DEPENDENCIES')
          for name, constraint in sorted(root['dependencies'].items()):
              version = select_version(name, constraint)
              result = inspect(name, version)
              result['constraint'] = constraint
              print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: End-to-end exact US Core resolve and verify
        run: |
          set -euo pipefail
          rm -rf /tmp/commandf-registry-smoke
          cargo run --locked --quiet -p commandf -- \
            pkg resolve hl7.fhir.us.core@8.0.1 \
            --cache /tmp/commandf-registry-smoke/cache \
            --lock /tmp/commandf-registry-smoke/commandf.lock
          cargo run --locked --quiet -p commandf -- \
            pkg verify \
            --cache /tmp/commandf-registry-smoke/cache \
            --lock /tmp/commandf-registry-smoke/commandf.lock
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('/tmp/commandf-registry-smoke/commandf.lock').read_text())
          matches = [
              item for item in lock['packages']
              if item['name'] == 'hl7.fhir.us.core' and item['version'] == '8.0.1'
          ]
          assert len(matches) == 1
          package = matches[0]
          assert len(package['sha256']) == 64
          assert package['source'] in {
              'https://packages.fhir.org/hl7.fhir.us.core/8.0.1',
              'https://packages2.fhir.org/web/hl7.fhir.us.core-8.0.1.tgz',
          }
          PY
