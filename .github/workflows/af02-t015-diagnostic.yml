name: af02-t015-diagnostic

on:
  push:
    branches:
      - feat/af02-a0-resource-runner
    paths:
      - ".github/workflows/af02-t015-diagnostic.yml"

permissions:
  contents: write

jobs:
  repair-lineage-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/af02-a0-resource-runner
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt, clippy
      - name: Repair canonical REBASE-aware lineage fixture
        run: |
          set -euo pipefail
          file=tools/af02-verifier/src/resource.rs
          grep -F 'let mut bootstrap_with_predecessor = policy().lineage;' "$file"
          grep -F 'let mut rebase_without_predecessor = policy().lineage;' "$file"
          sed -i '/let mut bootstrap_with_predecessor = policy().lineage;/a\        bootstrap_with_predecessor.mode = ResourceLineageMode::Bootstrap;' "$file"
          sed -i '/rebase_without_predecessor.mode = ResourceLineageMode::Rebase;/a\        rebase_without_predecessor.predecessor_blob_sha = None;\
        rebase_without_predecessor.predecessor_sha256 = None;' "$file"
          test "$(git diff --name-only)" = "tools/af02-verifier/src/resource.rs"
          git diff --check
          cargo fmt --all -- --check
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml resource_lineage_rejects_temporal_misclassification
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml
      - name: Commit verified fixture repair
        run: |
          set -euo pipefail
          git config user.name "commandF AF-02 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/af02-verifier/src/resource.rs
          test "$(git diff --cached --name-only)" = "tools/af02-verifier/src/resource.rs"
          git commit -m "test(af02): make resource lineage cases explicit"
          git push origin HEAD:feat/af02-a0-resource-runner
