name: af02-t015-diagnostic

on:
  push:
    branches:
      - feat/af02-a0-resource-runner
    paths:
      - ".github/workflows/af02-t015-diagnostic.yml"

permissions:
  contents: read

jobs:
  full-workspace-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - name: Run exact canonical CI Test command with output
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -o pipefail
          cargo test --locked --workspace --all-features -- --nocapture 2>&1 | tee /tmp/af02-t015-full-test.log
