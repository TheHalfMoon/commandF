name: af02-surface-policy-strengthen

on:
  push:
    branches:
      - chore/af02-a0-surface-policy-strengthening
    paths:
      - ".github/workflows/af02-surface-policy-strengthen.yml"

permissions:
  contents: write

jobs:
  strengthen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: chore/af02-a0-surface-policy-strengthening
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Strengthen only canonical surface memberships and lineage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          BASE_SHA = "7b8a2507d7428f55b494cc134948afb7a7c65738"
          BASE_TREE = "ad739dbe52cba8b7785327f39a820b8d97956333"
          POLICY = "specs/016-af-02-adversarial-test-strength/surface-policy.json"
          PREDECESSOR_BLOB = "f1bc6204d7b4634d06e3bcedef2dd5f97bebd493"

          def git(*args: str) -> bytes:
              return subprocess.check_output(["git", *args])

          actual_tree = git("rev-parse", f"{BASE_SHA}^{{tree}}").decode().strip()
          if actual_tree != BASE_TREE:
              raise SystemExit(f"base tree mismatch: {actual_tree}")
          actual_blob = git("rev-parse", f"{BASE_SHA}:{POLICY}").decode().strip()
          if actual_blob != PREDECESSOR_BLOB:
              raise SystemExit(f"predecessor blob mismatch: {actual_blob}")

          predecessor = git("show", f"{BASE_SHA}:{POLICY}")
          working = Path(POLICY).read_bytes()
          if working != predecessor:
              raise SystemExit("working policy does not equal canonical predecessor before strengthening")
          predecessor_sha256 = hashlib.sha256(predecessor).hexdigest()

          before = json.loads(predecessor)
          after = copy.deepcopy(before)

          additions = {
              "archive-gzip-decode": ["crates/commandf-pkg/src/artifact_scan.rs"],
              "archive-tar-scan": ["crates/commandf-pkg/src/artifact_scan.rs"],
              "filesystem-read": [
                  "tools/af02-verifier/src/main.rs",
                  "tools/af02-verifier/src/surface.rs",
              ],
              "subprocess-command-construction": ["tools/af02-verifier/src/surface.rs"],
          }

          before_surfaces = {item["surface_id"]: item for item in before["critical_surfaces"]}
          after_surfaces = {item["surface_id"]: item for item in after["critical_surfaces"]}
          if before_surfaces.keys() != after_surfaces.keys():
              raise SystemExit("critical surface identity set changed unexpectedly")

          for surface_id, paths in additions.items():
              surface = after_surfaces[surface_id]
              old_paths = list(before_surfaces[surface_id]["source_paths"])
              if any(path in old_paths for path in paths):
                  raise SystemExit(f"expected new source path already present for {surface_id}")
              surface["source_paths"] = sorted(old_paths + paths)

          lineage = after["lineage"]
          if lineage["mode"] != "REBASE":
              raise SystemExit("surface policy must already be in REBASE mode")
          if lineage["change_is_policy_only"] is not True:
              raise SystemExit("policy-only invariant is not true")
          if lineage["dependent_evidence_allowed_in_same_candidate"] is not False:
              raise SystemExit("same-candidate dependent evidence invariant is not false")
          lineage["canonical_base_sha"] = BASE_SHA
          lineage["canonical_base_tree"] = BASE_TREE
          lineage["predecessor_blob_sha"] = PREDECESSOR_BLOB
          lineage["predecessor_sha256"] = predecessor_sha256
          after["source_sha"] = BASE_SHA
          after["source_tree"] = BASE_TREE

          # Prove that only the four membership arrays and six source/lineage bindings changed.
          normalized = copy.deepcopy(after)
          normalized_surfaces = {item["surface_id"]: item for item in normalized["critical_surfaces"]}
          for surface_id in additions:
              normalized_surfaces[surface_id]["source_paths"] = list(before_surfaces[surface_id]["source_paths"])
          for key in (
              "canonical_base_sha",
              "canonical_base_tree",
              "predecessor_blob_sha",
              "predecessor_sha256",
          ):
              normalized["lineage"][key] = before["lineage"][key]
          normalized["source_sha"] = before["source_sha"]
          normalized["source_tree"] = before["source_tree"]
          if normalized != before:
              raise SystemExit("unexpected surface-policy semantic delta outside authorized fields")

          for surface_id, paths in additions.items():
              expected = sorted(before_surfaces[surface_id]["source_paths"] + paths)
              if after_surfaces[surface_id]["source_paths"] != expected:
                  raise SystemExit(f"source membership mismatch for {surface_id}")

          canonical = json.dumps(after, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          if canonical.endswith(b"\n"):
              raise SystemExit("canonical policy serialization unexpectedly has a trailing newline")
          Path(POLICY).write_bytes(canonical)
          print(f"predecessor_blob_sha={PREDECESSOR_BLOB}")
          print(f"predecessor_sha256={predecessor_sha256}")
          print(f"candidate_bytes={len(canonical)}")
          PY
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml surface::tests::canonical_surface_policy_parses
          git diff --check
      - name: Commit verified policy-only strengthening
        run: |
          set -euo pipefail
          git config user.name "commandF AF-02 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/016-af-02-adversarial-test-strength/surface-policy.json
          test "$(git diff --cached --name-only)" = "specs/016-af-02-adversarial-test-strength/surface-policy.json"
          git commit -m "chore(af02): strengthen surface policy memberships"
          git push origin HEAD:chore/af02-a0-surface-policy-strengthening
