name: af02-redacted-ruleset-repair

on:
  push:
    branches:
      - feat/af02-a0-authority-reconstruction

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TheHalfMoon/commandF'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          components: rustfmt
      - name: Apply, test, and remove temporary repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/af02_redacted_ruleset_repair.py
          cargo fmt --all
          cargo test --locked -p commandf-pkg --test af02_authority_reconstruction
          rm .github/workflows/af02-redacted-ruleset-repair.yml
          rm .github/scripts/af02_redacted_ruleset_repair.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(af02): bind redacted ruleset authority'
          git push origin "HEAD:${GITHUB_REF_NAME}"
