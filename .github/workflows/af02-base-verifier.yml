name: af02-base-verifier

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] canonical-base gate; candidate code is data-only and never executed
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  af02-base-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Acquire pinned verifier runtime image
        run: docker pull "docker.io/library/rust@sha256:9146b0f62e1939989aa96fc8d89699a43c5635bf212819235a773e1a9e71a98f"
      - name: Build canonical verifier in pinned runtime image
        run: |
          docker run --rm --pull=never \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/base,dst=/workspace" \
            --workdir /workspace/tools/af02-verifier \
            "docker.io/library/rust@sha256:9146b0f62e1939989aa96fc8d89699a43c5635bf212819235a773e1a9e71a98f" \
            cargo build --locked --release --target-dir /workspace/target/af02-verifier
      - name: Run canonical-base AF-02 gate
        run: bash "${GITHUB_WORKSPACE}/base/.github/scripts/run_af02_base_verifier.sh" "${GITHUB_WORKSPACE}/base" "${GITHUB_WORKSPACE}/candidate"
