name: af02-base-verifier

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] canonical-base gate; candidate code is data-only and never executed
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  af02-base-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate as data only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Install canonical verifier Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Build canonical verifier from locked base graph
        run: cargo build --locked --release --manifest-path "${GITHUB_WORKSPACE}/base/tools/af02-verifier/Cargo.toml" --target-dir "${GITHUB_WORKSPACE}/base/target/af02-verifier"
      - name: Acquire pinned verifier runtime image
        run: docker pull "docker.io/library/rust@sha256:9146b0f62e1939989aa96fc8d89699a43c5635bf212819235a773e1a9e71a98f"
      - name: Prepare canonical Git ownership for unprivileged verifier
        env:
          BASE_ROOT: ${{ github.workspace }}/base
        run: |
          sudo chown 65534:65534 "${BASE_ROOT}"
          sudo chown -R 65534:65534 "${BASE_ROOT}/.git"
          test "$(stat -c '%u:%g' "${BASE_ROOT}")" = "65534:65534"
          test "$(stat -c '%u:%g' "${BASE_ROOT}/.git")" = "65534:65534"
      - name: Run canonical-base AF-02 gate
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}/base
        run: bash "${GITHUB_WORKSPACE}/base/.github/scripts/run_af02_base_verifier.sh" "${GITHUB_WORKSPACE}/base" "${GITHUB_WORKSPACE}/candidate"
      - name: Restore canonical checkout ownership
        if: always()
        env:
          BASE_ROOT: ${{ github.workspace }}/base
        run: |
          sudo chown "$(id -u):$(id -g)" "${BASE_ROOT}"
          sudo chown -R "$(id -u):$(id -g)" "${BASE_ROOT}/.git"
