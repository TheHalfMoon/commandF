name: af02-t017-registry-static

on:
  push:
    branches:
      - feat/af02-a0-property-model-registry
    paths:
      - ".github/workflows/af02-t017-registry-static.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen property and model registries
        shell: bash
        env:
          AF02_SOURCE_SHA: fa91ce6bc3a51b12d554e078cab5154a0364df5b
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          source_sha = "fa91ce6bc3a51b12d554e078cab5154a0364df5b"
          spec = pathlib.Path("specs/016-af-02-adversarial-test-strength")
          property_path = spec / "property-config.json"
          model_path = spec / "model-registry.json"

          def load_canonical(path):
              raw = path.read_bytes()
              if raw.endswith(b"\n"):
                  raise SystemExit(f"{path} must not have a trailing newline")
              obj = json.loads(raw)
              canonical = json.dumps(obj, sort_keys=True, separators=(",", ":")).encode()
              if raw != canonical:
                  raise SystemExit(f"{path} is not canonical JSON")
              return obj, hashlib.sha256(raw).hexdigest()

          props, props_sha = load_canonical(property_path)
          models, models_sha = load_canonical(model_path)
          if props.get("schema") != "commandf.af02-property-config/v1":
              raise SystemExit("unexpected property config schema")
          if models.get("schema") != "commandf.af02-model-registry/v1":
              raise SystemExit("unexpected model registry schema")
          if props.get("source_sha") != source_sha or models.get("source_sha") != source_sha:
              raise SystemExit("registry source_sha drift")
          if props.get("execution_class") != "DESIGN_FREEZE_ONLY" or models.get("execution_class") != "DESIGN_FREEZE_ONLY":
              raise SystemExit("T017 must remain design-freeze-only")

          tool_lock = json.loads((spec / "tool-lock.json").read_bytes())
          proptest = next(e for e in tool_lock["entries"] if e["id"] == "proptest")
          if props["proptest"] != {
              "package": "proptest",
              "version": "1.11.0",
              "registry_checksum_sha256": proptest["registry_checksum_sha256"],
          }:
              raise SystemExit("property config proptest identity is not bound to T016")

          property_entries = props["properties"]
          property_ids = [p["property_id"] for p in property_entries]
          if len(property_ids) != 6 or property_ids != sorted(set(property_ids)):
              raise SystemExit("property ids must be exactly six sorted unique ids")
          if sum(p["case_count"] for p in property_entries) != 1536:
              raise SystemExit("unexpected frozen aggregate case count")
          for p in property_entries:
              expected_seed = hashlib.sha256(f"commandf-af02:{p['property_id']}:v1".encode()).hexdigest()
              if p["seed_hex"] != expected_seed:
                  raise SystemExit(f"seed derivation mismatch: {p['property_id']}")
              if p["case_count"] != 256:
                  raise SystemExit(f"unexpected case count: {p['property_id']}")
              if p["shrink"] != {"failure_persistence":"DISABLED","max_iterations":4096,"policy":"PROPTEST_DEFAULT_VALUE_TREE_V1"}:
                  raise SystemExit(f"unexpected shrink policy: {p['property_id']}")
              if not p["invalidity_mutations"] or not p["validity_domain"] or not p["limits"]:
                  raise SystemExit(f"incomplete property design: {p['property_id']}")

          model_entries = models["models"]
          model_ids = [m["model_id"] for m in model_entries]
          if len(model_ids) != 6 or model_ids != sorted(set(model_ids)):
              raise SystemExit("model ids must be exactly six sorted unique ids")
          model_by_id = {m["model_id"]: m for m in model_entries}
          reverse_property_ids = []
          for p in property_entries:
              if p["expected_model_id"] != p["independent_model_id"]:
                  raise SystemExit(f"expected/independent model mismatch: {p['property_id']}")
              model = model_by_id.get(p["independent_model_id"])
              if model is None or model["property_ids"] != [p["property_id"]]:
                  raise SystemExit(f"property/model bijection mismatch: {p['property_id']}")
              reverse_property_ids.extend(model["property_ids"])
          if sorted(reverse_property_ids) != property_ids:
              raise SystemExit("model/property reverse mapping mismatch")
          for m in model_entries:
              if m["independence_kind"] != "SEPARATE_REFERENCE_ALGORITHM":
                  raise SystemExit(f"model is not independent: {m['model_id']}")
              if not m["algorithm"] or not m["forbidden_product_calls"] or not m["invariants"]:
                  raise SystemExit(f"incomplete model contract: {m['model_id']}")
              if not m["future_implementation_path"].startswith("tests/assurance/af02_models/"):
                  raise SystemExit(f"unexpected model implementation path: {m['model_id']}")

          surface = json.loads((spec / "surface-policy.json").read_bytes())
          surface_ids = {entry["surface_id"] for entry in surface["critical_surfaces"]}
          for p in property_entries:
              for surface_id in [p["primary_surface_id"], *p["related_surface_ids"]]:
                  if surface_id not in surface_ids:
                      raise SystemExit(f"unknown critical surface id: {surface_id}")

          blob_map = {entry["path"]: entry["blob_sha"] for entry in models["target_source_blobs"]}
          referenced_paths = sorted({path for p in property_entries for path in p["target_source_paths"]} | {path for m in model_entries for path in m["target_source_paths"]})
          if sorted(blob_map) != referenced_paths:
              raise SystemExit("target_source_blobs must exactly cover referenced target paths")
          for path, expected_blob in sorted(blob_map.items()):
              if not re.fullmatch(r"[0-9a-f]{40}", expected_blob):
                  raise SystemExit(f"invalid blob sha: {path}")
              actual_blob = subprocess.check_output(["git", "rev-parse", f"{source_sha}:{path}"], text=True).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f"source blob binding mismatch: {path}")

          changed = subprocess.check_output(["git", "diff", "--name-only", f"{source_sha}...HEAD"], text=True).splitlines()
          expected_changed = sorted([
              ".github/workflows/af02-t017-registry-static.yml",
              "specs/016-af-02-adversarial-test-strength/model-registry.json",
              "specs/016-af-02-adversarial-test-strength/property-config.json",
          ])
          if sorted(changed) != expected_changed:
              raise SystemExit(f"unexpected T017 static candidate paths: {changed!r}")

          print(f"AF02_T017_PROPERTY_CONFIG_SHA256={props_sha}")
          print(f"AF02_T017_MODEL_REGISTRY_SHA256={models_sha}")
          print("AF02_T017_PROPERTY_COUNT=6")
          print("AF02_T017_MODEL_COUNT=6")
          print("AF02_T017_CASE_COUNT=1536")
          print("AF02_T017_STATIC_VALIDATION=PASS")
          PY
