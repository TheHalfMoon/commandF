name: af02-t018-diagnostic

on:
  push:
    branches:
      - feat/af02-a0-corpus-assertion-contract

permissions:
  contents: read

jobs:
  workspace-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Capture workspace test output
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --all-features -- --nocapture > af02-t018-workspace-tests.log 2>&1
          status=$?
          printf '%s\n' "$status" > af02-t018-workspace-tests.status
          exit 0
      - name: Upload AF-02 T018 diagnostic output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: af02-t018-workspace-tests
          path: |
            af02-t018-workspace-tests.log
            af02-t018-workspace-tests.status
          if-no-files-found: error
          retention-days: 1
