name: af02-t013-finalize

on:
  push:
    branches:
      - feat/af02-a0-t013-surface-proof
    paths:
      - ".github/workflows/af02-t013-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: feat/af02-a0-t013-surface-proof
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Qualify T013 verifier
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/af02-verifier/Cargo.toml
          cargo clippy --locked --manifest-path tools/af02-verifier/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml
          git diff --check
      - name: Derive exact canonical T013 evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/af02-t013-source
          git worktree add --detach /tmp/af02-t013-source 7b8a2507d7428f55b494cc134948afb7a7c65738
          cargo run --quiet --locked --manifest-path tools/af02-verifier/Cargo.toml --bin prove_surface -- \
            specs/016-af-02-adversarial-test-strength/surface-policy.json \
            specs/016-af-02-adversarial-test-strength/exclusion-policy.json \
            /tmp/af02-t013-source \
            > specs/016-af-02-adversarial-test-strength/surface-proof.json
          python3 -c 'import json,pathlib; p=pathlib.Path("specs/016-af-02-adversarial-test-strength/surface-proof.json"); b=p.read_bytes(); e=json.loads(b); assert not b.endswith(b"\n"); assert e["schema"]=="commandf.af02-surface-proof/v1"; assert e["source_sha"]=="7b8a2507d7428f55b494cc134948afb7a7c65738"; assert e["source_tree"]=="ad739dbe52cba8b7785327f39a820b8d97956333"; assert len(e["source_universe"])==59; assert len(e["raw_findings"])==105; assert len(e["discovery_inventory"])==105; assert e["classified_boundary_count"]==105; assert e["reviewed_exclusion_count"]==0; assert e["stale_entry_count"]==0; assert e["unclassified_boundary_count"]==0; print(e["source_universe_sha256"]); print(e["raw_findings_sha256"]); print(e["discovery_inventory_sha256"])'
          git worktree remove --force /tmp/af02-t013-source
      - name: Commit verified T013 implementation and evidence
        run: |
          set -euo pipefail
          git config user.name "commandF AF-02 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/af02-verifier/src/lib.rs \
            tools/af02-verifier/src/surface_proof.rs \
            tools/af02-verifier/src/bin/prove_surface.rs \
            specs/016-af-02-adversarial-test-strength/surface-proof.json
          git diff --cached --check
          git commit -m "feat(af02): prove exact surface dispositions"
          git push origin HEAD:feat/af02-a0-t013-surface-proof
