# Branch-only T013 derivation harness; delete before final PR.
name: af02-t013-finalize

on:
  push:
    branches:
      - feat/af02-a0-t013-surface-proof
    paths:
      - ".github/workflows/af02-t013-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24
        with:
          ref: feat/af02-a0-t013-surface-proof
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Qualify T013 verifier
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/af02-verifier/Cargo.toml
          cargo clippy --locked --manifest-path tools/af02-verifier/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/af02-verifier/Cargo.toml
          git diff --check
      - name: Derive exact canonical T013 evidence
        run: |
          set -euo pipefail
          POLICY=specs/016-af-02-adversarial-test-strength/surface-policy.json
          SOURCE_SHA=$(python3 -c 'import json; print(json.load(open("specs/016-af-02-adversarial-test-strength/surface-policy.json"))["source_sha"])')
          SOURCE_TREE=$(python3 -c 'import json; print(json.load(open("specs/016-af-02-adversarial-test-strength/surface-policy.json"))["source_tree"])')
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          rm -rf /tmp/af02-t013-source
          git worktree add --detach /tmp/af02-t013-source "$SOURCE_SHA"
          cargo run --quiet --locked --manifest-path tools/af02-verifier/Cargo.toml --bin prove_surface -- \
            "$POLICY" \
            specs/016-af-02-adversarial-test-strength/exclusion-policy.json \
            /tmp/af02-t013-source \
            > specs/016-af-02-adversarial-test-strength/surface-proof.json
          SOURCE_SHA="$SOURCE_SHA" SOURCE_TREE="$SOURCE_TREE" python3 -c 'import json,os,pathlib; p=pathlib.Path("specs/016-af-02-adversarial-test-strength/surface-proof.json"); b=p.read_bytes(); e=json.loads(b); assert not b.endswith(b"\n"); assert e["schema"]=="commandf.af02-surface-proof/v1"; assert e["source_sha"]==os.environ["SOURCE_SHA"]; assert e["source_tree"]==os.environ["SOURCE_TREE"]; assert len(e["source_universe"])==59; assert len(e["raw_findings"])==105; assert len(e["discovery_inventory"])==105; assert e["classified_boundary_count"]==105; assert e["reviewed_exclusion_count"]==0; assert e["stale_entry_count"]==0; assert e["unclassified_boundary_count"]==0; print(e["source_universe_sha256"]); print(e["raw_findings_sha256"]); print(e["discovery_inventory_sha256"])'
          git worktree remove --force /tmp/af02-t013-source
      - name: Commit verified T013 implementation and evidence
        run: |
          set -euo pipefail
          git config user.name "commandF AF-02 automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/af02-verifier/src/lib.rs \
            tools/af02-verifier/src/surface_proof.rs \
            tools/af02-verifier/src/bin/prove_surface.rs \
            specs/016-af-02-adversarial-test-strength/surface-proof.json
          git diff --cached --check
          git commit -m "feat(af02): prove exact surface dispositions"
          git push origin HEAD:feat/af02-a0-t013-surface-proof
