name: ops-inspect-uscore-801-archive

on:
  push:
    branches:
      - ops/inspect-uscore-801-archive

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official US Core 8.0.1 package layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import io
          import json
          import tarfile
          import urllib.request

          url = 'https://packages.fhir.org/hl7.fhir.us.core/8.0.1'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(128 * 1024 * 1024 + 1)
          if len(data) > 128 * 1024 * 1024:
              raise SystemExit('compressed archive exceeds 128 MiB probe bound')
          if data[:2] != b'\x1f\x8b':
              raise SystemExit('not gzip')

          compressed = len(data)
          tar_bytes = gzip.decompress(data)
          decompressed = len(tar_bytes)
          package_json_offset = None
          entries_before = 0
          payload_before = 0
          max_entry = ('', 0)
          manifest_size = None

          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
              for idx, member in enumerate(tf):
                  if member.size > max_entry[1]:
                      max_entry = (member.name, member.size)
                  normalized = member.name[2:] if member.name.startswith('./') else member.name
                  if normalized == 'package/package.json':
                      package_json_offset = member.offset
                      manifest_size = member.size
                      break
                  entries_before += 1
                  payload_before += member.size

          print(json.dumps({
              'compressed_bytes': compressed,
              'decompressed_tar_bytes': decompressed,
              'expansion_ratio': round(decompressed / compressed, 3),
              'entries_before_package_json': entries_before,
              'payload_bytes_before_package_json': payload_before,
              'package_json_tar_offset': package_json_offset,
              'package_json_size': manifest_size,
              'largest_entry_seen_before_manifest': {'name': max_entry[0], 'bytes': max_entry[1]},
          }, indent=2))
          PY
