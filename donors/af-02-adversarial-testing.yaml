      - LLVM source-based line/function/region coverage
      - machine-readable coverage evidence
      - measured baseline and regression floors
    exclusions:
      - no coverage percentage as semantic correctness proof
      - no guessed vanity floor
      - no broad product-source exclusion merely to raise coverage
      - no commandF runtime dependency

  - id: nextest-rs-nextest
