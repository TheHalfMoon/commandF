    ref: 984c861c8dfea28055254c5f1d2659ab2cd63f76
    tag: 0.13.2
    license: MIT OR Apache-2.0
    mode:
      - DEPEND_DEV_TOOL
      - STUDY
      - ADAPT_CONFIG
    scope:
      - libFuzzer cargo integration
      - fuzz workspace and target execution model
      - corpus/minimization workflow
      - structure-aware fuzz harness integration
    exclusions:
      - no commandF product runtime dependency
      - no semantic authority
      - no mutable tag/latest installation as retained proof identity
      - no claim that no-crash duration proves correctness

  - id: sourcefrog-cargo-mutants
