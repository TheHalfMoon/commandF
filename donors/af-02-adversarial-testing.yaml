      - shrinking/minimized counterexamples
      - deterministic/canonical invariant tests
      - adversarial structured-data generation
    exclusions:
      - implementation must pin crates.io version exactly as =1.11.0 and retain registry checksum
      - repository commit records researched upstream state and does not replace crates.io package identity
      - no commandF runtime dependency

adoption_decisions:
  commandf_product_runtime:
    use: none
    rationale: AF-02 tooling is development/test assurance only; commandF shipped Rust semantics must not depend on fuzz, mutation, coverage, or alternate test-runner tooling

  fuzz_workspace:
    use:
      - cargo-fuzz 0.13.2
      - libfuzzer-sys =0.4.13
      - arbitrary =1.4.2
      - nightly-2026-08-25
    rationale: raw and structure-aware discovery requires an isolated libFuzzer harness without changing the stable product workspace toolchain

  property_tests:
    use:
      - proptest =1.11.0
    rationale: generated invariant cases and shrinking strengthen canonicalization, validation, graph, path, and retained-evidence tests while remaining test-only

  flaky_detection:
    use:
      - cargo-nextest 0.9.143
      - retries = 2
      - flaky-result = fail
    rationale: retry is retained for diagnosis but a retry-pass must remain a failed AF-02 result; canonical cargo test remains mandatory

  coverage:
    use:
      - cargo-llvm-cov 0.9.0
    rationale: source-based coverage provides a measured regression diagnostic; first canonical baseline is measured before floors are frozen

  mutation:
    use:
      - cargo-mutants 27.1.0
    rationale: targeted viable source mutations measure whether existing tests detect plausible false-PASS and fail-open defects; every required survivor is killed or narrowly waived

  regression_corpus:
    use:
      - minimized synthetic/public reproducer promotion
      - stable scenario IDs and SHA-256 digests
    rationale: stochastic discovery artifacts must become deterministic reproducible regression evidence before a discovered defect is considered closed

review_before_copy:
  - verify exact source path and commit before copying any upstream code rather than using documented CLI/config interfaces
  - preserve license notices when required
  - record crates.io/binary checksums for the exact implementation-time artifacts
  - keep tool/config adoption separate from semantic authority
  - re-audit every version/pin change through AF-01 workflow/dependency policy
  - do not vendor upstream tool source unless a later reviewed task explicitly requires it
