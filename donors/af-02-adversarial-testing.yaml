    ref: 8ab1dc786a1f61a4e370416cc6c68b81a704e917
    tag: v27.1.0
    license: MIT
    mode:
      - DEPEND_DEV_TOOL
      - STUDY
      - ADAPT_CONFIG
    scope:
      - targeted Rust mutation testing
      - survivor/killed/timeout/build-failure evidence
      - source/function mutation inventory
      - narrow mutation exclusions
    exclusions:
      - no aggregate mutation score as correctness authority
      - no broad critical-module skip policy
      - no automatic classification of timeout/build failure as killed
      - no commandF runtime dependency

  - id: taiki-e-cargo-llvm-cov
    repository: https://github.com/taiki-e/cargo-llvm-cov
