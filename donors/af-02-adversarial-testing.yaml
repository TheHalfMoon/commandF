review_before_copy:
  - verify exact source path and commit before copying upstream code rather than using documented CLI/config interfaces
  - preserve license notices where required
  - prefer configuration and executable-tool adoption over vendoring source
  - re-audit every version or acquisition change through AF-01 workflow/dependency policy
  - no adopted tool becomes commandF semantic authority
