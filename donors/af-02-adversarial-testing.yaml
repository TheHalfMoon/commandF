    ref: 60fa45f638ffc3f35e74afa65737f45fcd32db2a
    tag: cargo-nextest-0.9.143
    license: MIT OR Apache-2.0
    mode:
      - DEPEND_DEV_TOOL
      - STUDY
      - ADAPT_CONFIG
