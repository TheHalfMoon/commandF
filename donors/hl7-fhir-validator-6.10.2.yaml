adoption_decisions:
  commandf_cf06:
    use:
      - exact 6.10.2 Java libraries in isolated tools/hl7-oracle Maven adapter
      - ComparisonSession and public comparison evidence surfaces
      - explicit process-boundary oracle invocation from commandF
    rationale: commandF measures divergence from the authoritative HL7 implementation instead of reimplementing the JVM oracle

  validator_cli_release_artifact:
    use: provenance-only
    rationale: published artifact digest anchors the official release identity; the fat jar is not committed to commandF

review_before_upgrade:
  - verify the new official release tag resolves to an exact source commit
  - verify published release artifact digest
  - inspect public comparison API changes
  - rerun adapter regressions and real R4 differential smoke
  - record any oracle behavior drift as evidence rather than silently changing commandF rules
