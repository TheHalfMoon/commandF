    scope:
      - authoritative HL7 FHIR validator/core comparison behavior
      - StructureDefinition comparison through public structured APIs
      - differential evidence against commandF CF-03 structural facts
    exclusions:
      - no vendored validator jar
      - no renderer HTML parsing
      - no reflection into private HL7 comparison internals
      - no oracle output may silently mutate CF-03 or CF-04 authority
