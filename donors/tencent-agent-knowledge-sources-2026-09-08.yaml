    scope:
      - provider-neutral sandbox lifecycle and task workspace boundaries
      - script validation and failure-preserving execution behavior
      - per-configuration network and capability policy patterns
      - explicit human approval as a durable non-transient tool state
      - principal/workspace-scoped durable memory
      - workspace agent and user memory enablement boundaries
      - user deletion tombstones and re-derivation prevention
      - sensitive-content redaction before durable memory storage
      - bounded recall with lexical vector and skip-mode diagnostics
      - distinction between injected memory and memory reported as relevant
