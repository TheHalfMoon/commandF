  - id: tencent-weknora
    repository: https://github.com/Tencent/WeKnora
    ref: 647848f3954dae34473b8a8d0e0eef5e0fb3a58e
    license: MIT_WITH_THIRD_PARTY_COMPONENTS
    mode: [STUDY]
    source_paths:
      - README.md
      - LICENSE
      - internal/sandbox/session_manager.go
      - internal/application/service/memory/scope.go
      - internal/application/service/memory/service.go
      - internal/application/service/memory/search.go
      - internal/application/service/memory/recall_trace.go
      - internal/agent/tools/search_memory.go
