adoption_decisions:
  commandf_core:
    use: none
    rationale: deterministic FHIR package diff check graph and impact paths remain independent of agent memory workflow and optimization runtimes

  af_02_current:
    use: comparative-study-only
    rationale: current AF-02 contracts are planning-frozen; these sources may inform later retrospective work but cannot alter T022-T028 authority without a separately authorized governance change

  future_agent_evidence_substrate:
    use:
      - DeepSeek Harness model-visible-means-logged and typed capability-seam patterns from the existing agent-harness donor record
      - WeKnora scoped observability and memory-recall diagnostics
      - LoopForge durable task state and artifact history
      - SkillHone exact run score provenance and redacted observation surfaces
    rationale: execution evidence must exist independently of model authority and remain replayable across interruption and review

  future_capability_sandbox_plane:
    use:
      - DeepSeek Harness guarded tool lifecycle and replaceable capability seams
      - WeKnora provider-neutral session sandbox workspace validation and approval-boundary patterns
    rationale: optional agent tools require deny-by-default capabilities bounded execution explicit approval and reconstructable results

  future_workflow_orchestration:
    use:
      - GitHub Spec Kit as process authority from the existing agent-harness donor record
      - LoopForge resumable role-bounded workflow-state patterns
    rationale: conversation state must not be the durable execution state and implementation review test responsibilities must remain separable

  future_bounded_memory:
    use:
      - WeKnora scope deletion tombstone redaction budget and recall-observability patterns
      - RoMem temporal-history and volatility concepts as research material only
    rationale: durable memory may improve continuity but must remain contextual erasable provenance-bearing temporally qualified and non-authoritative

  future_evaluation_optimization:
    use:
      - SkillHone evaluator-candidate isolation held-out visibility split score provenance and failure-layer diagnosis
      - AF-02 anti-forgery and exact-head principles once canonical
    rationale: the behavior being optimized must not be able to modify inspect or learn the protected authority used to judge final quality

  future_copilot:
    use:
      - proposal explanation retrieval triage and isolated drafting only after the evidence capability workflow memory and evaluation foundations are independently qualified
    rationale: models may accelerate interoperability work but deterministic commandF evidence remains the acceptance authority

  research:
    use:
      - RoMem temporal-preservation and temporal-contradiction concepts as study material only
    rationale: temporal preservation is already a commandF research measurement but RoMem code data model and redistribution rights are unverified at the pinned repository state

  source_portfolio:
    use:
      - map every retained donor family to a commandF capability gap preferred adoption mode activation unit rights evidence and requalification trigger before code adoption
    rationale: candidate inventory must not become uncontrolled source accumulation or architecture-by-copying

requalification_triggers:
  - any upstream repository ref change
  - any retained source path addition removal or rename
  - any mismatch between a retained source path and its recorded Git blob SHA
  - any license notice third-party-rights data-rights model-rights or redistribution-term change
  - any change to the destination trust boundary or intended adoption mode
  - any source-changing commandF commit after exact-head adoption qualification

review_before_adoption:
  - identify the exact commandF gap capability and activation unit served by the donor
  - prove the donor is not redundant with a selected implementation or authoritative oracle
  - re-pin the upstream ref and verify every retained source path against its recorded Git blob SHA before source adoption
  - perform file-scoped license permission third-party notice data and model-rights review as applicable
  - treat Founder project authorization as authorization to pursue reuse not as a substitute for upstream rights evidence
  - prefer DEPEND IMPORT or ORACLE before PORT and prefer narrow PORT before broad COPY
  - define the destination trust boundary before copying source
  - keep product semantics deterministic and independent of agent or model output
  - preserve hidden-evaluation isolation exact-head invalidation and provenance boundaries
  - retain donor-origin metadata notices and modification history
  - add positive negative conflict and failure-path tests for adopted behavior
  - assess dependency security release and SBOM impact
  - record source-selection rationale alternatives and requalification triggers
  - require an authorized CF AF or research unit before activation
