  - id: tencent-loopforge
    repository: https://github.com/Tencent/LoopForge
    ref: 09c765286f549624dd95434e1e6ef2249657cbeb
    license: MIT_WITH_THIRD_PARTY_ATTRIBUTION
    mode: [STUDY]
